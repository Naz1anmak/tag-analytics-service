spring:
  application:
    name: tag-analytics-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: tag_analytics

  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: tag_analytics

server:
  port: ${SERVER_PORT:8081}
